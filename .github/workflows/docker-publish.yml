name: Build and Publish Calculator API

on:
  push:
    branches:
      - main


permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io


jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate version
        id: version
        run: |
          source version.env

          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- version.env; then
            PATCH=$((PATCH + 1))
            sed -i "s/^PATCH=.*/PATCH=$PATCH/" version.env
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      - name: Save new patch version
        if: steps.version.outputs.version != ''
        run: |
          git diff --quiet version.env && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.env
          git commit -m "Bump patch version to ${{ steps.version.outputs.version }}"
          git push
