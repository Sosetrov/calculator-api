name: Build and Publish Calculator API

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Security Checks, Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate version
        id: version
        run: |
          source version.env

          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- version.env; then
            PATCH=$((PATCH + 1))
            sed -i "s/^PATCH=.*/PATCH=$PATCH/" version.env
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Scan repository for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Scan source code with Semgrep
        run: |
          semgrep scan --config auto \
            --json --output semgrep-report.json .
        continue-on-error: true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.version }}" \
            -t "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          format: json
          output: trivy-report.json
          exit-code: '0'
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:latest"

      - name: Save new patch version
        if: steps.version.outputs.version != ''
        run: |
          git diff --quiet version.env && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.env
          git commit -m "Bump patch version to ${{ steps.version.outputs.version }}"
          git push
